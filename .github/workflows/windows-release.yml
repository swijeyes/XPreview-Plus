# Cross-compiles the Windows x64 portable build on Linux and attaches it to a
# GitHub Release. It runs when a release is published; it can also be run by
# hand (Actions > Windows release > Run workflow) for an existing release tag.
name: Windows release

on:
  # Publishing a GitHub Release builds and attaches the files automatically.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the Windows zip to
        required: true
        default: v3.0

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # Files uploaded through the GitHub website lose their execute bit.
      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zip 7zip libdigest-sha-perl

      - name: Install host Qt (moc and rcc for the Windows build)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Build and package the Windows zip
        env:
          QT_HOST_PATH: ${{ env.QT_ROOT_DIR }}
        run: bash scripts/package-windows.sh release

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$TAG" release/XPreviewPlus-*-windows-x64-portable.zip release/XPreviewPlus-*-windows-x64-portable.zip.sha256 --clobber
