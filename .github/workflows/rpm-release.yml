# SPDX-License-Identifier: AGPL-3.0-or-later
# Builds an .rpm package for Fedora, openSUSE and other RPM distributions
# (x86_64), checks that it installs and starts on clean Fedora and openSUSE
# systems, and keeps it as a workflow artifact. It runs when a GitHub Release
# is published and attaches the .rpm to it; it can also be run by hand
# (Actions > RPM package > Run workflow) for an existing release tag, or with
# no tag to only build it.
#
# Built on Ubuntu 22.04 like the .deb, so it needs glibc 2.35 or newer
# (Fedora 36+, openSUSE Leap 16 / Tumbleweed, RHEL 10). Qt 6.11 and qpdf are
# included (in /opt/xpreview-plus); the other libraries come from the system
# and are declared as library (soname) dependencies, which dnf and zypper
# resolve to whatever package provides them.
# Install with:  sudo dnf install ./xpreview-plus-<version>-1.x86_64.rpm
name: RPM package

on:
  # Publishing a GitHub Release builds and attaches the files automatically.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the .rpm to (empty = build only)
        required: false
        default: v3

permissions:
  contents: write

env:
  # Downloaded tools are pinned and checked; the SHA-256 values are the ones
  # GitHub lists for the release assets.
  MINIZ_VER: 3.1.0
  MINIZ_SHA256: f9d3e769ec5fd5583955a3c22eea457fe806be0d507805966d1a5b0410c77dda
  LINUXDEPLOY_TAG: 1-alpha-20251107-1
  LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
  # The Qt plugin only publishes a rolling "continuous" build: this is the one
  # of 2026-08-22. If it is replaced, the check fails; take the new value from
  # https://api.github.com/repos/linuxdeploy/linuxdeploy-plugin-qt/releases/tags/continuous
  LINUXDEPLOY_QT_SHA256: cfc1055b2b9dbc08412b579f20990b7b41a17b61beaa5847dc9477c96c9e9617
  # linuxdeploy is itself an AppImage; this runs it without FUSE.
  APPIMAGE_EXTRACT_AND_RUN: 1
  PKG: xpreview-plus
  PREFIX: /opt/xpreview-plus

jobs:
  build:
    # The oldest supported system: the package needs glibc 2.35 or newer.
    runs-on: ubuntu-22.04
    outputs:
      rpm: ${{ steps.package.outputs.rpm }}
    steps:
      - uses: actions/checkout@v5

      # Files uploaded through the GitHub website lose their execute bit.
      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      # g++-12: Ubuntu 22.04's default g++ 11 lacks -ftrivial-auto-var-init.
      # The xcb libraries are what Qt's X11 platform plugin loads. Ghostscript
      # lets the PostScript tests run.
      - name: Install build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-12 unzip file imagemagick ghostscript \
            rpm desktop-file-utils \
            libgl1-mesa-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libdbus-1-3 \
            zlib1g-dev libjpeg-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtimageformats
          cache: true

      - name: Fetch PDFium, fonts and miniz
        run: |
          scripts/fetch-deps.sh
          curl -fsSL -o miniz.zip "https://github.com/richgel999/miniz/releases/download/$MINIZ_VER/miniz-$MINIZ_VER.zip"
          echo "$MINIZ_SHA256  miniz.zip" | sha256sum -c -
          mkdir -p third_party/windows/miniz
          unzip -qo miniz.zip -d third_party/windows/miniz
          rm miniz.zip

      # qpdf writes encrypted PDFs (Password Protection, "Protect with
      # password" in Save As). Ubuntu 22.04's qpdf is too old: a pinned,
      # checksummed release is built and bundled with the app.
      - name: Build qpdf
        env:
          CC: gcc-12
          CXX: g++-12
        run: scripts/build-qpdf.sh

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12 \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$PWD/third_party/qpdf" | tee configure.log
          grep -q "encrypted PDF saving enabled" configure.log || { echo "error: qpdf was not found" >&2; exit 1; }
          cmake --build build

      # Unit, security and UI layout tests (headless), as before every release.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      # linuxdeploy gathers Qt, its plugins and the libraries distributions
      # may lack into AppDir/usr, and points the binaries at them; that tree
      # becomes /opt/xpreview-plus.
      - name: Collect Qt and libraries
        run: |
          DESTDIR="$PWD/AppDir" cmake --install build
          convert resources/icon-1024.png -resize 512x512 xpreview-plus.png
          sed -e 's/^Exec=.*/Exec=xpreview-plus %F/' packaging/linux/xpreview.desktop > xpreview-plus.desktop
          grep -q '^Icon=' xpreview-plus.desktop || echo 'Icon=xpreview-plus' >> xpreview-plus.desktop
          desktop-file-validate xpreview-plus.desktop

          mkdir -p tools
          curl -fsSL -o tools/linuxdeploy-x86_64.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/$LINUXDEPLOY_TAG/linuxdeploy-x86_64.AppImage"
          curl -fsSL -o tools/linuxdeploy-plugin-qt-x86_64.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          echo "$LINUXDEPLOY_SHA256  tools/linuxdeploy-x86_64.AppImage" | sha256sum -c -
          echo "$LINUXDEPLOY_QT_SHA256  tools/linuxdeploy-plugin-qt-x86_64.AppImage" | sha256sum -c -
          chmod +x tools/*.AppImage

          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          # libqpdf is bundled from the qpdf built above.
          export LD_LIBRARY_PATH="$PWD/third_party/qpdf/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export PATH="$PWD/tools:$PATH"
          # X11 (also used under Wayland via XWayland), plus the headless
          # platform for the install check.
          export EXTRA_PLATFORM_PLUGINS="libqoffscreen.so"
          # linuxdeploy looks up Exec= in AppDir/usr/bin, where the program is
          # still "XPreview+"; the packaged entry runs it as "xpreview-plus".
          mkdir -p deploy
          sed -e 's/^Exec=.*/Exec=XPreview+ %F/' xpreview-plus.desktop > deploy/xpreview-plus.desktop
          tools/linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable "AppDir/usr/bin/XPreview+" --desktop-file deploy/xpreview-plus.desktop \
            --icon-file xpreview-plus.png --plugin qt

      - name: Build the package
        id: package
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="$(sed -n 's/^project(XPreview VERSION \([0-9]*\.[0-9]*\).*/\1/p' CMakeLists.txt)"
          RPM="${PKG}-${VERSION}-1.x86_64.rpm"
          ROOT="$PWD/pkgroot"
          mkdir -p "$ROOT$PREFIX" "$ROOT/usr/bin" "$ROOT/usr/share/applications" "$ROOT/usr/share/doc/$PKG"

          # The app and everything it ships with (as in the .deb).
          cp -a AppDir/usr/. "$ROOT$PREFIX/"
          rm -rf "$ROOT$PREFIX/share/applications" "$ROOT$PREFIX/share/icons"
          # The C++ runtime comes from the system: an older bundled copy would
          # break newer system libraries such as GPU drivers.
          rm -f "$ROOT$PREFIX"/lib/libstdc++.so* "$ROOT$PREFIX"/lib/libgcc_s.so*
          ln -s "$PREFIX/bin/XPreview+" "$ROOT/usr/bin/$PKG"
          cp xpreview-plus.desktop "$ROOT/usr/share/applications/"
          for size in 48 64 128 256 512; do
            dir="$ROOT/usr/share/icons/hicolor/${size}x${size}/apps"
            mkdir -p "$dir"
            convert resources/icon-1024.png -resize "${size}x${size}" "$dir/$PKG.png"
          done
          cp LICENSE THIRD_PARTY_NOTICES.md manual/xpreview-plus-manual.pdf "$ROOT/usr/share/doc/$PKG/"
          cp -R licenses "$ROOT/usr/share/doc/$PKG/"

          # Dependencies: every shared library the binaries load that the
          # package does not contain, as RPM soname capabilities (what rpm's
          # own dependency generator writes, e.g. "libxcb.so.1()(64bit)").
          mapfile -t elf < <(find "$ROOT$PREFIX" -type f -exec sh -c 'file -b "$1" | grep -q "^ELF 64"' _ {} \; -print)
          bundled="$(find "$ROOT$PREFIX" \( -type f -o -type l \) -name 'lib*.so*' -printf '%f\n' | sort -u)"
          REQUIRES="$(for f in "${elf[@]}"; do objdump -p "$f" | awk '/NEEDED/ {print $2}'; done | sort -u \
            | grep -vxF -f <(echo "$bundled") | sed 's/$/()(64bit)/' | paste -sd, -)"
          [[ -n "$REQUIRES" ]] || { echo "error: no library dependencies found" >&2; exit 1; }
          echo "Requires: $REQUIRES"

          mkdir -p rpmbuild/SPECS
          cat > rpmbuild/SPECS/$PKG.spec <<EOF
          Name:           $PKG
          Version:        $VERSION
          Release:        1
          Summary:        Fast, private viewer for PDF, PostScript, images, RTF and ODT
          License:        AGPL-3.0-or-later
          URL:            https://github.com/$REPO
          Packager:       Sanjeeva Wijeyesakere <$OWNER@users.noreply.github.com>
          BuildArch:      x86_64
          # Dependencies are worked out above; bundled libraries are private.
          AutoReqProv:    no
          Requires:       $REQUIRES
          Recommends:     ghostscript
          %global debug_package %{nil}
          %global _build_id_links none
          %global __os_install_post %{nil}
          %global __arch_install_post %{nil}
          %global _missing_build_ids_terminate_build 0

          %description
          XPreview+ opens PDF documents, PostScript and EPS, images (PNG, JPEG,
          GIF, WebP, TIFF, BMP, SVG), RTF and OpenDocument text, and exports
          anything it opens to PDF. It annotates PDFs, fills in PDF forms,
          password protects PDFs and edits PDF pages: reorder, rotate, delete,
          insert and combine. It never connects to the internet. PostScript and
          EPS need Ghostscript.

          %install
          mkdir -p %{buildroot}
          cp -a $ROOT/. %{buildroot}/

          %files
          $PREFIX
          /usr/bin/$PKG
          /usr/share/applications/$PKG.desktop
          /usr/share/icons/hicolor/*/apps/$PKG.png
          %doc /usr/share/doc/$PKG
          EOF

          rpmbuild -bb --define "_topdir $PWD/rpmbuild" rpmbuild/SPECS/$PKG.spec
          mkdir -p release
          cp "rpmbuild/RPMS/x86_64/$RPM" release/
          rpm -qip "release/$RPM"
          rpm -qp --requires "release/$RPM"
          (cd release && sha256sum "$RPM" | tee "$RPM.sha256")
          echo "rpm=$RPM" >> "$GITHUB_OUTPUT"

      - name: Keep as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: release/*.rpm*

  # Each system starts clean, so a missing dependency shows up here.
  install-check:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:43
            install: dnf install -y
            remove: dnf remove -y
          - image: fedora:44
            install: dnf install -y
            remove: dnf remove -y
          - image: opensuse/tumbleweed
            install: zypper --non-interactive install --allow-unsigned-rpm ghostscript
            remove: zypper --non-interactive remove
    container: ${{ matrix.image }}
    steps:
      # The checkout action needs tar and gzip, which minimal images lack.
      - name: Prepare the container
        run: |
          if command -v zypper >/dev/null; then zypper --non-interactive install tar gzip; else dnf install -y tar gzip; fi

      - uses: actions/checkout@v5
        with:
          sparse-checkout: tests/corpus

      - uses: actions/download-artifact@v4
        with:
          name: rpm

      # The package manager installs the declared dependencies, and the
      # recommended Ghostscript, as it would for a user.
      - name: Install the package
        run: ${{ matrix.install }} "./${{ needs.build.outputs.rpm }}"

      - name: Launch check
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          command -v xpreview-plus
          xpreview-plus --screenshot smoke.png "$PWD/tests/corpus/rich.fodt" | tee smoke.txt
          grep -q "Page 1 of" smoke.txt
          xpreview-plus --screenshot smoke-eps.png "$PWD/tests/corpus/sample.eps" | tee smoke-eps.txt
          grep -q "EPS image" smoke-eps.txt

      - name: Remove the package
        run: ${{ matrix.remove }} ${{ env.PKG }} && test ! -e /opt/xpreview-plus/bin

  release:
    needs: [build, install-check]
    if: (inputs.tag || github.event.release.tag_name) != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rpm

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          RPM: ${{ needs.build.outputs.rpm }}
        run: gh release upload "$TAG" "$RPM" "$RPM.sha256" --clobber --repo "${{ github.repository }}"
