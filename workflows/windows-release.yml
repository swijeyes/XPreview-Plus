# Cross-compiles the Windows x64 portable build on Linux and attaches it to an
# existing GitHub Release. Run it by hand: Actions > Windows release > Run workflow.
name: Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the Windows zip to
        required: true
        default: v1.2

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # Files uploaded through the GitHub website lose their execute bit.
      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zip 7zip libdigest-sha-perl

      - name: Install host Qt (moc and rcc for the Windows build)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      # The Windows Qt needs the host Qt tools (QT_HOST_PATH). Fail here, with the
      # path shown, rather than deep inside CMake.
      - name: Check host Qt
        run: |
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
          test -x "$QT_ROOT_DIR/bin/qmake" || { echo "error: host Qt not found under QT_ROOT_DIR" >&2; exit 1; }
          ls "$QT_ROOT_DIR/bin" | head -40

      - name: Build and package the Windows zip
        env:
          QT_HOST_PATH: ${{ env.QT_ROOT_DIR }}
        run: bash scripts/package-windows.sh release

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" release/XPreviewPlus-*-windows-x64-portable.zip release/XPreviewPlus-*-windows-x64-portable.zip.sha256 --clobber
